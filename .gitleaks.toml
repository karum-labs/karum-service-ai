# Gitleaks configuration for the Karum repos.
#
# Prevents a committed Qloo X-Api-Key or GCP credential from landing on the
# remote. Extends the default rule set with project-specific patterns for the
# credentials this stack uses.
title = "Karum gitleaks config"

[extend]
# Inherit the full default rule set (AWS, GCP, private keys, etc.).
useDefault = true

[[rules]]
id = "qloo-api-key"
description = "Qloo API key (sent as the X-Api-Key header)"
# Qloo hackathon keys are long opaque tokens; match the header assignment form
# and any 32+ char token assigned to a Qloo-looking variable.
regex = '''(?i)(?:x-api-key|qloo[_-]?api[_-]?key|qloo[_-]?key)\s*[:=]\s*['"]?([A-Za-z0-9_\-]{32,})['"]?'''
tags = ["key", "qloo", "hackathon"]

[[rules]]
id = "gcp-service-account"
description = "GCP service-account JSON private key"
regex = '''-----BEGIN (?:RSA |EC )?PRIVATE KEY-----'''
tags = ["key", "gcp", "private"]

[[rules]]
id = "gcp-api-key"
description = "Google Cloud API key (AIza...)"
regex = '''AIza[0-9A-Za-z_\-]{35}'''
tags = ["key", "gcp"]

# Allow-list: never flag the example values shipped in .env.example, which are
# deliberately empty or obviously fake.
[allowlist]
description = "Allow example and documentation values"
paths = [
    '''\.env\.example$''',
    '''README\.md$''',
    '''\.md$''',
]
regexes = [
    '''^your[-_].*$''',
    '''^<.*>$''',
    '''karum''',
]
