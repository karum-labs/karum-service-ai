[project]
name = "karum-service-ai"
version = "0.1.0"
description = "Gemini, search grounding, and pitch drafting for the Karum brand agent."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Karum" }
]
requires-python = ">=3.13"
# Runtime dependencies are added via `uv add` and pinned in uv.lock.
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.30.1",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "httpx>=0.28.1",
    "langchain>=1.2.0",
    "langchain-core>=1.5.0",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=1.7.0",
    "langchain-anthropic>=1.7.0",
    "langchain-ollama>=1.0.0",
    "openai>=1.0.0",
    # Pinned to the generator in karum-infra/proto/buf.gen.yaml
    # (protocolbuffers/python:v36.2). The generated modules carry
    # "Protobuf Python Version: 7.36.2" and validate the runtime on import,
    # so a runtime older than the gencode fails the service at startup.
    "protobuf==7.36.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Repository = "https://github.com/karum-labs/karum-service-ai"

[project.scripts]
karum-service-ai = "karum_service_ai.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
# Target the pinned Python version and keep line length consistent.
target-version = "py313"
line-length = 100
# Only lint the source and tests directories.
src = ["src", "tests"]
extend-exclude = ["src/karum"]

[tool.ruff.lint]
# Select a focused rule set: pycodestyle errors, pyflakes, isort, and unused
# imports. Extendable later with mypy-style rules once types firm up.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["karum_service_ai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# Discover tests in the tests/ directory.
testpaths = ["tests"]
# "src" puts the service package on the path; "." puts the repo root on it so
# `from tests.conftest import ...` resolves when pytest is run as a console
# script (CI runs `uv run pytest`, which does not add the working directory
# to sys.path the way `python -m pytest` does).
pythonpath = ["src", "."]
# Show individual test names for readable CI output.
addopts = "-v"
